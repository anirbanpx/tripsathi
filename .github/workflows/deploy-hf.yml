name: Deploy backend to HF Spaces

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          chmod +x scripts/deploy-hf.sh
          ./scripts/deploy-hf.sh
